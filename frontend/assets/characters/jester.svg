<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Jester hat -->
  <rect x="3" y="0" width="2" height="1" fill="#FF0000"/>
  <rect x="11" y="0" width="2" height="1" fill="#00AA00"/>
  <rect x="4" y="0" width="1" height="1" fill="#FFDD00"/>
  <rect x="7" y="0" width="2" height="1" fill="#FFDD00"/>
  <rect x="11" y="0" width="1" height="1" fill="#FFDD00"/>
  <rect x="3" y="1" width="4" height="1" fill="#FF0000"/>
  <rect x="7" y="1" width="1" height="1" fill="#FFDD00"/>
  <rect x="8" y="1" width="4" height="1" fill="#00AA00"/>
  <rect x="4" y="2" width="8" height="1" fill="#FFDD00"/>
  <rect x="4" y="2" width="3" height="1" fill="#FF0000"/>
  <rect x="9" y="2" width="3" height="1" fill="#00AA00"/>
  <!-- Face -->
  <rect x="4" y="3" width="1" height="1" fill="#FF0000"/>
  <rect x="5" y="3" width="6" height="1" fill="#F4C69B"/>
  <rect x="11" y="3" width="1" height="1" fill="#00AA00"/>
  <rect x="5" y="4" width="6" height="1" fill="#F4C69B"/>
  <!-- Crazy eyes -->
  <rect x="6" y="4" width="1" height="1" fill="#FF4444"/>
  <rect x="9" y="4" width="1" height="1" fill="#44FF44"/>
  <!-- Wild grin -->
  <rect x="5" y="5" width="6" height="1" fill="#F4C69B"/>
  <rect x="6" y="5" width="4" height="1" fill="#E8A080"/>
  <!-- Neck -->
  <rect x="7" y="6" width="2" height="1" fill="#F4C69B"/>
  <!-- Multi-color outfit -->
  <rect x="4" y="7" width="4" height="1" fill="#FF0000"/>
  <rect x="8" y="7" width="4" height="1" fill="#00AA00"/>
  <rect x="3" y="8" width="5" height="1" fill="#FF0000"/>
  <rect x="8" y="8" width="5" height="1" fill="#00AA00"/>
  <rect x="3" y="9" width="5" height="1" fill="#CC0000"/>
  <rect x="8" y="9" width="5" height="1" fill="#008800"/>
  <rect x="4" y="10" width="4" height="1" fill="#FFDD00"/>
  <rect x="8" y="10" width="4" height="1" fill="#FFDD00"/>
  <rect x="5" y="11" width="6" height="1" fill="#FFCC00"/>
  <!-- Legs -->
  <rect x="5" y="12" width="2" height="1" fill="#FF0000"/>
  <rect x="9" y="12" width="2" height="1" fill="#00AA00"/>
  <rect x="5" y="13" width="2" height="1" fill="#FF0000"/>
  <rect x="9" y="13" width="2" height="1" fill="#00AA00"/>
  <!-- Feet (curled jester shoes) -->
  <rect x="4" y="14" width="3" height="1" fill="#FF4444"/>
  <rect x="9" y="14" width="3" height="1" fill="#44CC44"/>
</svg>
