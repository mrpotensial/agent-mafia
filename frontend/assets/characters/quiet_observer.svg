<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Hood -->
  <rect x="5" y="0" width="6" height="1" fill="#444444"/>
  <rect x="4" y="1" width="8" height="1" fill="#444444"/>
  <rect x="3" y="2" width="10" height="1" fill="#555555"/>
  <rect x="4" y="2" width="8" height="1" fill="#444444"/>
  <!-- Shadowed face under hood -->
  <rect x="3" y="3" width="1" height="1" fill="#555555"/>
  <rect x="4" y="3" width="1" height="1" fill="#444444"/>
  <rect x="5" y="3" width="6" height="1" fill="#C4965B"/>
  <rect x="11" y="3" width="1" height="1" fill="#444444"/>
  <rect x="12" y="3" width="1" height="1" fill="#555555"/>
  <rect x="5" y="4" width="6" height="1" fill="#D4A67B"/>
  <!-- Eyes (dim, watchful) -->
  <rect x="6" y="4" width="1" height="1" fill="#88AAAA"/>
  <rect x="9" y="4" width="1" height="1" fill="#88AAAA"/>
  <!-- Lower face -->
  <rect x="5" y="5" width="6" height="1" fill="#D4A67B"/>
  <rect x="7" y="5" width="2" height="1" fill="#B88855"/>
  <!-- Neck -->
  <rect x="7" y="6" width="2" height="1" fill="#D4A67B"/>
  <!-- Gray outfit / cloak -->
  <rect x="3" y="7" width="10" height="1" fill="#555555"/>
  <rect x="2" y="8" width="12" height="1" fill="#555555"/>
  <rect x="2" y="9" width="12" height="1" fill="#444444"/>
  <rect x="3" y="10" width="10" height="1" fill="#555555"/>
  <rect x="4" y="11" width="8" height="1" fill="#444444"/>
  <!-- Legs (hidden under cloak) -->
  <rect x="5" y="12" width="6" height="1" fill="#444444"/>
  <rect x="5" y="13" width="2" height="1" fill="#333333"/>
  <rect x="9" y="13" width="2" height="1" fill="#333333"/>
  <!-- Feet -->
  <rect x="4" y="14" width="3" height="1" fill="#2D2D2D"/>
  <rect x="9" y="14" width="3" height="1" fill="#2D2D2D"/>
</svg>
